[project]
name = "django-aegis"
version = "0.1.0"
description = "IP based blocker with rate limiting"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["django>=6.0.5", "django-stubs>=6.0.4", "pytest-django>=4.12.0"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
strict = true

[tool.django-stubs]
django_settings_module = "config.settings"

[dependency-groups]
dev = ["mypy>=2.1.0"]
